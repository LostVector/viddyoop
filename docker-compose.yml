# Local single-node deployment. iTunes indexing/import are separate opt-in profiles.
services:
  temporal:
    cpus: ${VIDDYOOP_TEMPORAL_CPUS-${VIDYOOP_TEMPORAL_CPUS:-1.0}}
    mem_limit: ${VIDDYOOP_TEMPORAL_MEMORY-${VIDYOOP_TEMPORAL_MEMORY:-1g}}
    image: temporalio/temporal:1.10.0@sha256:003508da05989e7cf0d583cfce521c4bb2732e733574e3040db8f1284783baa2
    entrypoint: ["temporal"]
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:${VIDDYOOP_TEMPORAL_PORT-${VIDYOOP_TEMPORAL_PORT:-7233}}:7233"
      - "127.0.0.1:${VIDDYOOP_TEMPORAL_UI_PORT-${VIDYOOP_TEMPORAL_UI_PORT:-8233}}:8233"
    volumes:
      - temporal-data:/home/temporal
    healthcheck:
      test: ["CMD", "temporal", "workflow", "list", "--limit", "1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pipeline:
    cpus: ${VIDDYOOP_PIPELINE_CPUS-${VIDYOOP_PIPELINE_CPUS:-2.0}}
    mem_limit: ${VIDDYOOP_PIPELINE_MEMORY-${VIDYOOP_PIPELINE_MEMORY:-4g}}
    image: ${VIDDYOOP_IMAGE-${VIDYOOP_IMAGE:-ghcr.io/lostvector/viddyoop:local}}
    build: .
    init: true
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${VIDDYOOP_PIPELINE_JAVA_OPTIONS-${VIDYOOP_PIPELINE_JAVA_OPTIONS:--Xmx512m}}
      VIDDYOOP_TEMPORAL: temporal:7233
      VIDDYOOP_NAMESPACE: ${VIDDYOOP_NAMESPACE-${VIDYOOP_NAMESPACE:-default}}
      VIDDYOOP_PROFILE: ${VIDDYOOP_PROFILE-${VIDYOOP_PROFILE:-apple-tv-hevc-v1}}
      VIDDYOOP_ENCODE_WORKERS: ${VIDDYOOP_ENCODE_WORKERS-${VIDYOOP_ENCODE_WORKERS:-1}}
      VIDDYOOP_PREPROCESS_WORKERS: ${VIDDYOOP_PREPROCESS_WORKERS-${VIDYOOP_PREPROCESS_WORKERS:-1}}
      VIDDYOOP_PUBLISH_WORKERS: ${VIDDYOOP_PUBLISH_WORKERS-${VIDYOOP_PUBLISH_WORKERS:-1}}
      VIDDYOOP_MIN_FREE_BYTES: ${VIDDYOOP_MIN_FREE_BYTES-${VIDYOOP_MIN_FREE_BYTES:-10737418240}}
      VIDDYOOP_SETTLE_MS: ${VIDDYOOP_SETTLE_MS-${VIDYOOP_SETTLE_MS:-60000}}
      VIDDYOOP_POLL_MS: ${VIDDYOOP_POLL_MS-${VIDYOOP_POLL_MS:-5000}}
      VIDDYOOP_SCRATCH_MULTIPLIER: ${VIDDYOOP_SCRATCH_MULTIPLIER-${VIDYOOP_SCRATCH_MULTIPLIER:-4}}
      VIDDYOOP_ARCHIVE_POLICY: ${VIDDYOOP_ARCHIVE_POLICY-${VIDYOOP_ARCHIVE_POLICY:-movies}}
    volumes:
      - ${VIDDYOOP_INBOX_DIR-${VIDYOOP_INBOX_DIR:-./local/inbox}}:/inbox
      - work-data:/work
      - ${VIDDYOOP_LIBRARY_DIR-${VIDYOOP_LIBRARY_DIR:-./local/library}}:/library
      - ${VIDDYOOP_ARCHIVE_DIR-${VIDYOOP_ARCHIVE_DIR:-./local/archive}}:/archive
      - catalog-data:/db
    read_only: true
    tmpfs:
      - /tmp:exec,size=67108864,mode=1777
    stop_grace_period: 30s
    restart: unless-stopped

  itunes-index:
    cpus: ${VIDDYOOP_ITUNES_INDEX_CPUS-${VIDYOOP_ITUNES_INDEX_CPUS:-0.5}}
    mem_limit: ${VIDDYOOP_ITUNES_INDEX_MEMORY-${VIDYOOP_ITUNES_INDEX_MEMORY:-512m}}
    profiles: [itunes, itunes-import]
    image: ${VIDDYOOP_IMAGE-${VIDYOOP_IMAGE:-ghcr.io/lostvector/viddyoop:local}}
    build: .
    command: ["itunes-index", "--serve", "--interval-minutes", "${VIDDYOOP_ITUNES_INDEX_INTERVAL_MINUTES-${VIDYOOP_ITUNES_INDEX_INTERVAL_MINUTES:-15}}"]
    init: true
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      JAVA_TOOL_OPTIONS: ${VIDDYOOP_ITUNES_INDEX_JAVA_OPTIONS-${VIDYOOP_ITUNES_INDEX_JAVA_OPTIONS:--Xmx128m}}
      VIDDYOOP_TEMPORAL: temporal:7233
      VIDDYOOP_NAMESPACE: ${VIDDYOOP_NAMESPACE-${VIDYOOP_NAMESPACE:-default}}
      VIDDYOOP_ITUNES_XML: /itunes-lib/${VIDDYOOP_ITUNES_XML_NAME-${VIDYOOP_ITUNES_XML_NAME:-iTunes Library.xml}}
    volumes:
      - catalog-data:/db
      - type: bind
        source: ${VIDDYOOP_ITUNES_LIBRARY_DIR-${VIDYOOP_ITUNES_LIBRARY_DIR:-./local/itunes}}
        target: /itunes-lib
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:exec,size=67108864,mode=1777
    # Pipeline heartbeat is specific to the pipeline process, not this schedule worker.
    healthcheck:
      disable: true
    restart: unless-stopped

  itunes-import:
    cpus: ${VIDDYOOP_ITUNES_IMPORT_CPUS-${VIDYOOP_ITUNES_IMPORT_CPUS:-0.5}}
    mem_limit: ${VIDDYOOP_ITUNES_IMPORT_MEMORY-${VIDYOOP_ITUNES_IMPORT_MEMORY:-1g}}
    profiles: [itunes-import]
    image: ${VIDDYOOP_IMAGE-${VIDYOOP_IMAGE:-ghcr.io/lostvector/viddyoop:local}}
    build: .
    command: ["itunes-import", "--serve", "--reconcile-only=${VIDDYOOP_ITUNES_RECONCILE_ONLY-${VIDYOOP_ITUNES_RECONCILE_ONLY:-false}}"]
    init: true
    depends_on:
      temporal:
        condition: service_healthy
      pipeline:
        condition: service_healthy
      itunes-index:
        condition: service_started
    environment:
      JAVA_TOOL_OPTIONS: ${VIDDYOOP_ITUNES_IMPORT_JAVA_OPTIONS-${VIDYOOP_ITUNES_IMPORT_JAVA_OPTIONS:--Xmx256m}}
      VIDDYOOP_TEMPORAL: temporal:7233
      VIDDYOOP_NAMESPACE: ${VIDDYOOP_NAMESPACE-${VIDYOOP_NAMESPACE:-default}}
      VIDDYOOP_ITUNES_ADD: /itunes-delivery/${VIDDYOOP_ITUNES_ADD_NAME-${VIDYOOP_ITUNES_ADD_NAME:-Automatically Add to iTunes.localized}}
      VIDDYOOP_ITUNES_STAGING: /itunes-delivery/.viddyoop-staging
      VIDDYOOP_ITUNES_HOST_MEDIA_ROOT: ${VIDDYOOP_ITUNES_HOST_MEDIA_ROOT-${VIDYOOP_ITUNES_HOST_MEDIA_ROOT:-}}
      VIDDYOOP_ITUNES_MEDIA_ROOT: /itunes-media
      VIDDYOOP_ITUNES_REJECTED: ${VIDDYOOP_ITUNES_REJECTED-${VIDYOOP_ITUNES_REJECTED:-}}
      VIDDYOOP_ITUNES_IMPORT_CHECK_SECONDS: ${VIDDYOOP_ITUNES_IMPORT_CHECK_SECONDS-${VIDYOOP_ITUNES_IMPORT_CHECK_SECONDS:-60}}
      VIDDYOOP_ITUNES_IMPORT_SCAN_SECONDS: ${VIDDYOOP_ITUNES_IMPORT_SCAN_SECONDS-${VIDYOOP_ITUNES_IMPORT_SCAN_SECONDS:-10}}
    volumes:
      - catalog-data:/db
      - type: bind
        source: ${VIDDYOOP_LIBRARY_DIR-${VIDYOOP_LIBRARY_DIR:-./local/library}}
        target: /library
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${VIDDYOOP_ITUNES_DELIVERY_DIR-${VIDYOOP_ITUNES_DELIVERY_DIR:-./local/itunes-delivery}}
        target: /itunes-delivery
        bind:
          create_host_path: false
      - type: bind
        source: ${VIDDYOOP_ITUNES_MEDIA_DIR-${VIDYOOP_ITUNES_MEDIA_DIR:-./local/itunes-media}}
        target: /itunes-media
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:exec,size=67108864,mode=1777
    healthcheck:
      disable: true
    restart: unless-stopped

volumes:
  temporal-data:
  work-data:
  catalog-data:
