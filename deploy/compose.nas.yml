# Overlay docker-compose.server.yml. Media is mounted by the Linux Docker engine;
# PostgreSQL and the catalog stay on local Docker volumes.
# Missing required settings resolve to invalid references/paths, so startup fails
# closed even on Compose versions that eagerly expand nested required checks.
services:
  nas-check:
    image: ${VIDDYOOP_IMAGE:-${VIDYOOP_IMAGE:-invalid://set-viddyoop-image}}
    cpus: 0.25
    mem_limit: 64m
    read_only: true
    network_mode: none
    entrypoint: [sh, -ec]
    command:
      - |
        test -f /data/.viddyoop-media-root || {
          echo 'Expected isolated NAS root marker is missing' >&2; exit 1;
        }
        for directory in inbox work library archive; do
          test -d "/data/$$directory" || {
            echo "Missing NAS directory: $$directory" >&2; exit 1;
          }
        done
        probe=$$(mktemp /data/work/.deployment-write-check.XXXXXXXX)
        trap 'rm -f "$$probe"' EXIT
        # CIFS can briefly return ESTALE when reopening a freshly created file.
        # Do not change inode/mount options or accept a persistent write failure.
        for attempt in 1 2 3 4 5; do
          if (printf 'viddyoop deployment check\n' > "$$probe" && sync "$$probe"); then
            exit 0
          fi
          sleep 1
        done
        echo 'NAS write/fsync check failed after metadata-settle retries' >&2
        exit 1
    volumes:
      - &nas-media
        type: volume
        source: nas-public-temp
        target: /data
        volume:
          nocopy: true
          subpath: ${VIDDYOOP_NAS_SUBPATH:-${VIDYOOP_NAS_SUBPATH:-/__SET_VIDDYOOP_NAS_SUBPATH__}}

  pipeline:
    image: ${VIDDYOOP_IMAGE:-${VIDYOOP_IMAGE:-invalid://set-viddyoop-image}}
    cpuset: ${VIDDYOOP_PIPELINE_CPUSET-${VIDYOOP_PIPELINE_CPUSET:-0-11}}
    cpus: ${VIDDYOOP_PIPELINE_CPUS-${VIDYOOP_PIPELINE_CPUS:-12.0}}
    mem_limit: ${VIDDYOOP_PIPELINE_MEMORY-${VIDYOOP_PIPELINE_MEMORY:-10g}}
    depends_on:
      nas-check:
        condition: service_completed_successfully
    environment:
      VIDDYOOP_INBOX: /data/inbox
      VIDDYOOP_WORK: /data/work
      VIDDYOOP_LIBRARY: /data/library
      VIDDYOOP_ARCHIVE: /data/archive
    # Remove inherited host-media mounts instead of adding an additional mount.
    volumes: !override
      - *nas-media
      - catalog-data:/db

volumes:
  nas-public-temp:
    name: ${VIDDYOOP_NAS_VOLUME-${VIDYOOP_NAS_VOLUME:-nas-public-temp}}
    external: true
